media:
  input: media/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, webp, svg]
  rename: safe
settings:
  content:
    merge: true
  commit:
    identity: app
content:
  - name: flash
    label: Flash
    type: collection
    path: src/content/flash
    filename: '{primary}.md'
    view: { fields: [title, code, status, draft] }
    fields: &common
      - {
          name: title,
          label: Título,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
          required: true,
        }
      - {
          name: description,
          label: Descripción,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - { name: cover, label: Imagen, type: image, required: true }
      - {
          name: coverAlt,
          label: Texto alternativo,
          type: string,
          required: true,
        }
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: code, label: Código, type: string, required: true }
      - name: status
        label: Estado
        type: select
        options:
          values:
            - { label: Disponible, name: disponible }
            - { label: Vendido, name: vendido }
      - {
          name: note,
          label: Nota,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - {
          name: showInCarousel,
          label: Mostrar en el carrusel,
          type: boolean,
          default: true,
        }
      - name: categories
        label: Categorías
        type: reference
        options:
          collection: flash-categories
          multiple: true
          search: 'id,label'
          value: '{fields.id}'
          label: '{fields.label}'
      - { name: body, label: Contenido, type: rich-text }
    operations: { create: true, rename: true, delete: true }
  - name: tattoos
    label: Tatuajes
    type: collection
    path: src/content/tattoos
    filename: '{primary}.md'
    fields:
      - {
          name: title,
          label: Título,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
          required: true,
        }
      - {
          name: description,
          label: Descripción,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - { name: cover, label: Fotografía, type: image, required: true }
      - {
          name: coverAlt,
          label: Texto alternativo,
          type: string,
          required: true,
        }
      - {
          name: showInCarousel,
          label: Mostrar en el carrusel,
          type: boolean,
          default: true,
        }
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: body, label: Contenido, type: rich-text }
    operations: { create: true, rename: true, delete: true }
  - name: obras
    label: Obras
    type: collection
    path: src/content/obras
    filename: '{primary}.md'
    fields:
      - {
          name: title,
          label: Título,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
          required: true,
        }
      - {
          name: description,
          label: Descripción,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - { name: technique, label: Técnica, type: string }
      - { name: dimensions, label: Dimensiones, type: string }
      - { name: widthCm, label: Ancho en cm, type: number }
      - { name: heightCm, label: Alto en cm, type: number }
      - name: status
        label: Estado
        type: select
        options:
          values:
            - { label: Disponible, name: disponible }
            - { label: Reservada, name: reservada }
            - { label: Vendida, name: vendida }
      - { name: priceEur, label: Precio en euros, type: number }
      - { name: showPrice, label: Mostrar precio, type: boolean }
      - name: collection
        label: Colección
        type: reference
        options:
          collection: obra-collections
          search: 'id,title'
          value: '{fields.id}'
          label: '{fields.title}'

      - { name: cover, label: Portada, type: image, required: true }
      - {
          name: coverAlt,
          label: Texto alternativo,
          type: string,
          required: true,
        }
      - name: gallery
        label: Galería
        type: object
        list: true
        fields:
          [
            { name: src, label: Imagen, type: image },
            { name: alt, label: Texto alternativo, type: string },
          ]
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: body, label: Contenido, type: rich-text }
    operations: { create: true, rename: true, delete: true }
  - name: proyectos
    label: Proyectos
    type: collection
    path: src/content/proyectos
    filename: '{primary}.md'
    fields:
      - {
          name: title,
          label: Título,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - {
          name: description,
          label: Introducción,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - { name: client, label: Cliente, type: string }
      - { name: services, label: Servicios, type: string }
      - { name: year, label: Año, type: string }
      - {
          name: contribution,
          label: Mi aportación,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - { name: cover, label: Portada, type: image }
      - { name: coverAlt, label: Texto alternativo, type: string }
      - name: gallery
        label: Galería
        type: object
        list: true
        fields:
          [
            { name: src, label: Imagen, type: image },
            { name: alt, label: Texto alternativo, type: string },
          ]
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: body, label: Contenido, type: rich-text }
    operations: { create: true, rename: true, delete: true }
  - name: sobre-mi
    label: Página Sobre mí
    type: file
    path: src/content/paginas/sobre-mi.md
    fields:
      - {
          name: title,
          label: Título,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - {
          name: eyebrow,
          label: Antetítulo,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - {
          name: subtitle,
          label: Subtítulo,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - {
          name: tagline,
          label: Texto introductorio,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - { name: location, label: Ubicación, type: string }
      - { name: portrait, label: Retrato, type: image }
      - { name: portraitAlt, label: Texto alternativo, type: string }
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: body, label: Presentación, type: rich-text }
  - name: site
    label: Datos generales
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Nombre, type: string }
      - { name: artisticName, label: Nombre artístico, type: string }
      - name: theme
        label: Tema visual
        type: object
        fields:
          - {
              name: background,
              label: Fondo,
              type: string,
              default: '#F7F3EC',
              pattern: '^#[0-9a-fA-F]{6}$',
              description: 'Código hexadecimal de seis cifras. Reserva V1: #F7F3EC.',
            }
          - {
              name: text,
              label: Texto,
              type: string,
              default: '#252821',
              pattern: '^#[0-9a-fA-F]{6}$',
              description: 'Código hexadecimal de seis cifras. Reserva V1: #252821.',
            }
          - {
              name: accent,
              label: Acento,
              type: string,
              default: '#923E30',
              pattern: '^#[0-9a-fA-F]{6}$',
              description: 'Código hexadecimal de seis cifras. Reserva V1: #923E30.',
            }
          - {
              name: surface,
              label: Superficie,
              type: string,
              default: '#E6E9DF',
              pattern: '^#[0-9a-fA-F]{6}$',
              description: 'Código hexadecimal de seis cifras. Reserva V1: #E6E9DF.',
            }
          - {
              name: decorative,
              label: Acento decorativo,
              type: string,
              default: '#E4B54D',
              pattern: '^#[0-9a-fA-F]{6}$',
              description: 'Código hexadecimal de seis cifras. Reserva V1: #E4B54D.',
            }
          - name: headingFont
            label: Tipografía de titulares
            type: select
            default: roboto
            options:
              values:
                - { label: Roboto, name: roboto }
                - { label: Georgia, name: georgia }
                - { label: Arial, name: arial }
                - { label: Helvetica Neue / Helvetica / Arial, name: system }
          - name: bodyFont
            label: Tipografía de cuerpo y controles
            type: select
            default: roboto
            options:
              values:
                - { label: Roboto, name: roboto }
                - { label: Georgia, name: georgia }
                - { label: Arial, name: arial }
                - { label: Helvetica Neue / Helvetica / Arial, name: system }
      - name: home
        label: Portada
        type: object
        fields:
          - {
              name: title,
              label: Titular,
              type: rich-text,
              options: { format: markdown, media: false, switcher: false },
              required: true,
            }
          - {
              name: intro,
              label: Introducción,
              type: rich-text,
              options: { format: markdown, media: false, switcher: false },
              required: true,
            }
          - { name: eyebrow, label: Antetítulo, type: string }
          - { name: titleEmphasis, label: Fragmento en cursiva, type: string }
          - {
              name: heroImage,
              label: Imagen principal,
              type: image,
              required: true,
            }
          - {
              name: heroImageAlt,
              label: Texto alternativo de la imagen,
              type: string,
              required: true,
            }
          - {
              name: heroImageCaption,
              label: Pie de imagen principal,
              type: string,
            }
          - { name: secondaryImage, label: Imagen secundaria, type: image }
          - {
              name: secondaryImageAlt,
              label: Texto alternativo secundario,
              type: string,
            }
          - {
              name: secondaryImageCaption,
              label: Pie de imagen secundaria,
              type: string,
            }
          - name: primaryCta
            label: Llamada a la acción principal
            type: object
            fields:
              [
                { name: label, label: Texto, type: string },
                { name: href, label: Enlace, type: string },
              ]
          - name: secondaryCta
            label: Llamada a la acción secundaria
            type: object
            fields:
              [
                { name: label, label: Texto, type: string },
                { name: href, label: Enlace, type: string },
              ]
          - name: guestsCta
            label: Enlace a próximos guests
            type: object
            fields:
              - { name: label, label: Texto, type: string, required: true }
              - { name: href, label: Enlace, type: string, required: true }
              - {
                  name: visible,
                  label: Mostrar en la portada,
                  type: boolean,
                  default: true,
                }
          - { name: agendaLabel, label: Etiqueta de agenda, type: string }
          - {
              name: agendaVisible,
              label: Mostrar resumen de agenda,
              type: boolean,
              default: true,
            }
          - name: featuredWorks
            label: Obras destacadas
            type: reference
            options:
              collection: obras
              multiple: true
              search: 'title'
              value: '{path}'
              label: '{fields.title}'
          - {
              name: workHeading,
              label: Título de la sección de trabajo,
              type: rich-text,
              options: { format: markdown, media: false, switcher: false },
            }
          - {
              name: featuredHeading,
              label: Título de destacados,
              type: rich-text,
              options: { format: markdown, media: false, switcher: false },
            }
          - name: disciplines
            label: Disciplinas
            type: object
            list: true
            fields:
              [
                {
                  name: title,
                  label: Título,
                  type: rich-text,
                  options: { format: markdown, media: false, switcher: false },
                },
                {
                  name: text,
                  label: Texto,
                  type: rich-text,
                  options: { format: markdown, media: false, switcher: false },
                },
                { name: href, label: Enlace, type: string },
                { name: linkLabel, label: Texto del enlace, type: string },
                { name: image, label: Imagen, type: image },
                { name: imageAlt, label: Texto alternativo, type: string },
              ]
      - { name: email, label: Email público, type: string }
      - { name: instagram, label: URL de Instagram, type: string }
      - { name: instagramLabel, label: Usuario de Instagram, type: string }
      - name: navigation
        label: Navegación principal
        type: object
        list: true
        fields:
          [
            { name: href, label: Ruta, type: string, required: true },
            { name: label, label: Texto, type: string, required: true },
          ]
      - name: ui
        label: Textos de interfaz
        type: object
        fields:
          - {
              name: skipLink,
              label: Enlace para saltar al contenido,
              type: string,
            }
          - name: homePage
            label: Metadatos de portada
            type: object
            fields:
              [
                { name: title, label: Título SEO, type: string },
                { name: description, label: Descripción SEO, type: text },
              ]
          - name: about
            label: Metadatos de Sobre mí
            type: object
            fields:
              [
                { name: title, label: Título SEO, type: string },
                { name: description, label: Descripción SEO, type: text },
              ]
          - name: header
            label: Cabecera
            type: object
            fields:
              [
                {
                  name: tattooCta,
                  label: Llamada a la acción de tattoo,
                  type: string,
                },
                { name: openMenu, label: Abrir menú, type: string },
                { name: closeMenu, label: Cerrar menú, type: string },
                {
                  name: navigationLabel,
                  label: Etiqueta de navegación,
                  type: string,
                },
                {
                  name: logo,
                  label: Logotipo,
                  type: object,
                  fields:
                    [
                      { name: alt, label: Texto alternativo, type: string },
                      { name: mobile, label: Logo móvil, type: image },
                      { name: tablet, label: Logo tablet, type: image },
