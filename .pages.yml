media:
  input: media/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, webp, svg]
  rename: safe
settings:
  content:
    merge: true
  commit:
    identity: app
content:
  - name: flash
    label: Flash
    type: collection
    path: src/content/flash
    filename: '{primary}.md'
    view: { fields: [title, code, status, draft] }
    fields: &common
      - { name: title, label: Título, type: string, required: true }
      - { name: description, label: Descripción, type: text }
      - { name: cover, label: Imagen, type: image, required: true }
      - {
          name: coverAlt,
          label: Texto alternativo,
          type: string,
          required: true,
        }
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: code, label: Código, type: string, required: true }
      - name: status
        label: Estado
        type: select
        options:
          values:
            - { label: Disponible, name: disponible }
            - { label: Reservado, name: reservado }
            - { label: Tatuado, name: tatuado }
      - { name: note, label: Nota, type: string }
      - {
          name: showInCarousel,
          label: Mostrar en el carrusel,
          type: boolean,
          default: true,
        }
      - {
          name: categories,
          label: Categorías (usa los identificadores de Categorías de flash),
          type: string,
          list: true,
        }
      - { name: body, label: Contenido, type: rich-text }
    operations: { create: true, rename: false, delete: false }
  - name: tattoos
    label: Tatuajes
    type: collection
    path: src/content/tattoos
    filename: '{primary}.md'
    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: description, label: Descripción, type: text }
      - { name: cover, label: Fotografía, type: image, required: true }
      - {
          name: coverAlt,
          label: Texto alternativo,
          type: string,
          required: true,
        }
      - {
          name: showInCarousel,
          label: Mostrar en el carrusel,
          type: boolean,
          default: true,
        }
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: body, label: Contenido, type: rich-text }
    operations: { create: true, rename: false, delete: false }
  - name: obras
    label: Obras
    type: collection
    path: src/content/obras
    filename: '{primary}.md'
    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: description, label: Descripción, type: text }
      - { name: technique, label: Técnica, type: string }
      - { name: dimensions, label: Dimensiones, type: string }
      - { name: widthCm, label: Ancho en cm, type: number }
      - { name: heightCm, label: Alto en cm, type: number }
      - name: status
        label: Estado
        type: select
        options:
          values:
            - { label: Disponible, name: disponible }
            - { label: Reservada, name: reservada }
            - { label: Vendida, name: vendida }
      - { name: priceEur, label: Precio en euros, type: number }
      - { name: showPrice, label: Mostrar precio, type: boolean }
      - { name: collection, label: Colección, type: string }
      - { name: cover, label: Portada, type: image, required: true }
      - {
          name: coverAlt,
          label: Texto alternativo,
          type: string,
          required: true,
        }
      - name: gallery
        label: Galería
        type: object
        list: true
        fields:
          [
            { name: src, label: Imagen, type: image },
            { name: alt, label: Texto alternativo, type: string },
          ]
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: body, label: Contenido, type: rich-text }
    operations: { create: true, rename: false, delete: false }
  - name: proyectos
    label: Proyectos
    type: collection
    path: src/content/proyectos
    filename: '{primary}.md'
    fields:
      - { name: title, label: Título, type: string }
      - { name: description, label: Introducción, type: text }
      - { name: client, label: Cliente, type: string }
      - { name: services, label: Servicios, type: string }
      - { name: year, label: Año, type: string }
      - { name: contribution, label: Mi aportación, type: text }
      - { name: cover, label: Portada, type: image }
      - { name: coverAlt, label: Texto alternativo, type: string }
      - name: gallery
        label: Galería
        type: object
        list: true
        fields:
          [
            { name: src, label: Imagen, type: image },
            { name: alt, label: Texto alternativo, type: string },
          ]
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: body, label: Contenido, type: rich-text }
    operations: { create: true, rename: false, delete: false }
  - name: sobre-mi
    label: Página Sobre mí
    type: file
    path: src/content/paginas/sobre-mi.md
    fields:
      - { name: title, label: Título, type: string }
      - { name: eyebrow, label: Antetítulo, type: string }
      - { name: subtitle, label: Subtítulo, type: string }
      - { name: location, label: Ubicación, type: string }
      - { name: portrait, label: Retrato, type: image }
      - { name: portraitAlt, label: Texto alternativo, type: string }
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: body, label: Presentación, type: rich-text }
  - name: site
    label: Datos generales
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Nombre, type: string }
      - { name: artisticName, label: Nombre artístico, type: string }
      - name: home
        label: Portada
        type: object
        fields:
          - { name: title, label: Titular, type: string, required: true }
          - { name: intro, label: Introducción, type: text, required: true }
          - {
              name: heroImage,
              label: Imagen principal,
              type: image,
              required: true,
            }
          - {
              name: heroImageAlt,
              label: Texto alternativo de la imagen,
              type: string,
              required: true,
            }
          - name: primaryCta
            label: Llamada a la acción principal
            type: object
            fields:
              [
                { name: label, label: Texto, type: string },
                { name: href, label: Enlace, type: string },
              ]
          - name: secondaryCta
            label: Llamada a la acción secundaria
            type: object
            fields:
              [
                { name: label, label: Texto, type: string },
                { name: href, label: Enlace, type: string },
              ]
          - name: guestsCta
            label: Enlace a próximos guests
            type: object
            fields:
              - { name: label, label: Texto, type: string, required: true }
              - { name: href, label: Enlace, type: string, required: true }
              - {
                  name: visible,
                  label: Mostrar en la portada,
                  type: boolean,
                  default: true,
                }
          - {
              name: workHeading,
              label: Título de la sección de trabajo,
              type: string,
            }
          - name: disciplines
            label: Disciplinas
            type: object
            list: true
            fields:
              [
                { name: title, label: Título, type: string },
                { name: text, label: Texto, type: text },
                { name: href, label: Enlace, type: string },
                { name: linkLabel, label: Texto del enlace, type: string },
                { name: image, label: Imagen, type: image },
                { name: imageAlt, label: Texto alternativo, type: string },
              ]
      - { name: email, label: Email público, type: string }
      - { name: instagram, label: URL de Instagram, type: string }
      - { name: instagramLabel, label: Usuario de Instagram, type: string }
      - name: navigation
        label: Navegación principal
        type: object
        list: true
        fields:
          [
            { name: href, label: Ruta, type: string, required: true },
            { name: label, label: Texto, type: string, required: true },
          ]
      - name: ui
        label: Textos de interfaz
        type: object
        fields:
          - {
              name: skipLink,
              label: Enlace para saltar al contenido,
              type: string,
            }
          - name: homePage
            label: Metadatos de portada
            type: object
            fields:
              [
                { name: title, label: Título SEO, type: string },
                { name: description, label: Descripción SEO, type: text },
              ]
          - name: about
            label: Metadatos de Sobre mí
            type: object
            fields:
              [
                { name: title, label: Título SEO, type: string },
                { name: description, label: Descripción SEO, type: text },
              ]
          - name: header
            label: Cabecera
            type: object
            fields:
              [
                {
                  name: tattooCta,
                  label: Llamada a la acción de tattoo,
                  type: string,
                },
                { name: openMenu, label: Abrir menú, type: string },
                { name: closeMenu, label: Cerrar menú, type: string },
                {
                  name: navigationLabel,
                  label: Etiqueta de navegación,
                  type: string,
                },
              ]
          - name: footer
            label: Pie de página
            type: object
            fields:
              [
                {
                  name: formsHeading,
                  label: Título de formularios,
                  type: string,
                },
                { name: disciplines, label: Disciplinas, type: string },
                { name: contact, label: Enlace de contacto, type: string },
                { name: email, label: Enlace de email, type: string },
                { name: instagram, label: Enlace de Instagram, type: string },
                {
                  name: sampleNotice,
                  label: Aviso de contenido de muestra,
                  type: string,
                },
              ]
          - name: forms
            label: Formularios
            type: object
            fields:
              [
                {
                  name: unavailable,
                  label: Formulario no disponible,
                  type: string,
                },
                { name: tattoo, label: Tattoo, type: string },
                { name: artwork, label: Obra original, type: string },
                { name: illustration, label: Ilustración, type: string },
                { name: general, label: Otra consulta, type: string },
                { name: cityAlerts, label: Avisos por ciudad, type: string },
              ]
          - name: contact
            label: Página de contacto
            type: object
            fields:
              [
                { name: title, label: Título SEO, type: string },
                { name: description, label: Descripción SEO, type: text },
                { name: heading, label: Titular, type: string },
                { name: intro, label: Introducción, type: text },
              ]
          - name: tattoo
            label: Página de tattoo
            type: object
            fields:
              [
                { name: title, label: Título SEO, type: string },
                { name: description, label: Descripción SEO, type: text },
                { name: heading, label: Titular, type: string },
                { name: intro, label: Introducción, type: text },
                { name: tattoos, label: Tatuajes, type: string },
                { name: flash, label: Flash, type: string },
                { name: viewAll, label: Ver todos, type: string },
                { name: noTattoos, label: Sin tatuajes, type: string },
                {
                  name: flashSampleNotice,
                  label: Aviso de flash de muestra,
                  type: string,
                },
                { name: noFlash, label: Sin flash, type: string },
              ]
          - name: flash
            label: Página de flash
            type: object
            fields:
              [
                { name: title, label: Título SEO, type: string },
                { name: description, label: Descripción SEO, type: text },
                { name: heading, label: Titular, type: string },
                {
                  name: filtersLabel,
                  label: Etiqueta de filtros,
                  type: string,
                },
                { name: all, label: Todos, type: string },
                { name: empty, label: Sin resultados, type: string },
                {
                  name: pageSizeBefore,
                  label: Texto antes del selector,
                  type: string,
                },
                {
                  name: pageSizeAfter,
                  label: Texto después del selector,
                  type: string,
                },
                {
                  name: paginationLabel,
                  label: Etiqueta de paginación,
                  type: string,
                },
                { name: previous, label: Anterior, type: string },
                { name: next, label: Siguiente, type: string },
                { name: pageStatus, label: Estado de página, type: string },
                { name: requestCta, label: Pedir este flash, type: string },
              ]
          - name: artwork
            label: Página de obra
            type: object
            fields:
              [
                { name: title, label: Título SEO, type: string },
                { name: description, label: Descripción SEO, type: text },
                { name: eyebrow, label: Antetítulo del catálogo, type: string },
                { name: heading, label: Titular, type: string },
                { name: intro, label: Introducción, type: text },
                {
                  name: filtersLabel,
                  label: Etiqueta de filtros,
                  type: string,
                },
                { name: all, label: Todas, type: string },
                { name: available, label: Ver disponibles, type: string },
                {
                  name: detailEyebrow,
                  label: Antetítulo de ficha,
                  type: string,
                },
                { name: shipping, label: Envío, type: string },
                {
                  name: interestCta,
                  label: Me interesa esta obra,
                  type: string,
                },
                { name: cardCta, label: Ver la pieza, type: string },
              ]
          - name: illustration
            label: Página de ilustración
            type: object
            fields:
              [
                { name: title, label: Título SEO, type: string },
                { name: description, label: Descripción SEO, type: text },
                { name: heading, label: Titular, type: string },
                { name: intro, label: Introducción, type: text },
                {
                  name: projectEyebrow,
                  label: Antetítulo de ficha,
                  type: string,
                },
                {
                  name: projectCardEyebrow,
                  label: Antetítulo de tarjeta,
                  type: string,
                },
                { name: projectCta, label: Ver proyecto, type: string },
                {
                  name: contributionEyebrow,
                  label: Antetítulo de aportación,
                  type: string,
                },
                {
                  name: contactHeading,
                  label: Titular de contacto,
                  type: string,
                },
                {
                  name: contactCta,
                  label: Llamada a la acción de contacto,
                  type: string,
                },
              ]
          - name: carousel
            label: Carruseles
            type: object
            fields:
              [
                { name: previous, label: Anterior, type: string },
                { name: next, label: Siguiente, type: string },
                {
                  name: controlsPrefix,
                  label: Prefijo de controles,
                  type: string,
                },
              ]
  - name: social
    label: Compartir y favicon
    type: file
    path: src/data/social.json
    format: json
    fields:
      - { name: favicon, label: Favicon, type: image, required: true }
      - {
          name: title,
          label: Título al compartir,
          type: string,
          required: true,
        }
      - {
          name: description,
          label: Descripción al compartir,
          type: text,
          required: true,
        }
      - {
          name: image,
          label: Imagen única al compartir,
          type: image,
          required: true,
        }
      - {
          name: imageAlt,
          label: Descripción de la imagen al compartir,
          type: string,
          required: true,
        }
  - name: guests
    label: Próximos Guests
    type: file
    path: src/data/guests.json
    format: json
    fields:
      - {
          name: heading,
          label: Título de la agenda,
          type: string,
          required: true,
        }
      - { name: eyebrow, label: Antetítulo, type: string }
      - {
          name: inquiryLabel,
          label: Texto para consultar cita,
          type: string,
          required: true,
        }
      - {
          name: mapsLabel,
          label: Texto del enlace a Google Maps,
          type: string,
          required: true,
        }
      - {
          name: alertsLabel,
          label: Enlace de avisos por ciudad,
          type: string,
          required: true,
        }
      - {
          name: emptyMessage,
          label: Mensaje sin fechas visibles,
          type: text,
          required: true,
        }
      - {
          name: footerHeading,
          label: Título en el pie de página,
          type: string,
          required: true,
        }
      - {
          name: showInFooter,
          label: Mostrar resumen en el pie de página,
          type: boolean,
          default: true,
        }
      - name: entries
        label: Visitas
        type: object
        list: true
        fields:
          - name: id
            label: Identificador del enlace
            type: string
            required: true
            description: Único para cada visita. Usa minúsculas, números y guiones (por ejemplo barcelona-octubre). Consérvalo para no cambiar los enlaces.
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - { name: city, label: Ciudad, type: string, required: true }
          - { name: studio, label: Estudio, type: string }
          - { name: address, label: Dirección, type: text }
          - name: mapsUrl
            label: Enlace a Google Maps
            type: string
            description: Pega el enlace completo de Google Maps, incluido https://. Opcional e independiente de la dirección.
          - { name: description, label: Descripción, type: text }
          - name: startDate
            label: Fecha de inicio
            type: date
            required: true
            options: { format: yyyy-MM-dd, time: false }
          - name: endDate
            label: Fecha de fin
            type: date
            required: true
            description: Para una sola jornada, repite la fecha de inicio. Incluye el año correspondiente a esta visita.
            options: { format: yyyy-MM-dd, time: false }
          - name: color
            label: Color
            type: string
            required: true
            default: '#deb9a0'
            description: 'Color hexadecimal de seis cifras. Ejemplos: #deb9a0, #b7c3a7, #e1c985, #b6bdce.'
            pattern: '^#[0-9a-fA-F]{6}$'
          - name: visible
            label: Visible
            type: boolean
            default: true
            description: Activa la visita en la agenda y en el pie. Desactívala cuando ya no quieras anunciarla.
  - name: ciudades
    label: Ciudades
    type: file
    path: src/data/ciudades.json
    format: json
    fields:
      - { name: cities, label: Ciudades, type: string, list: true }
      - { name: note, label: Nota, type: text }
  - name: flash-categories
    label: Categorías de flash
    type: file
    path: src/data/flash-categories.json
    format: json
    fields:
      - name: categories
        label: Categorías
        type: object
        list: true
        fields:
          [
            { name: id, label: Identificador, type: string, required: true },
            { name: label, label: Nombre, type: string, required: true },
          ]
