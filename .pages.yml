  - name: social
    label: Compartir en redes y favicon
    type: file
    path: src/data/social.json
    format: json
    fields:
      - { name: favicon, label: Favicon, type: image, required: true }
      - {
          name: title,
          label: Título general para compartir la portada,
          type: string,
          required: true,
        }
      - {
          name: description,
          label: Descripción general para compartir la portada,
          type: text,
          required: true,
        }
      - {
          name: image,
          label: Imagen general de respaldo,
          type: image,
          required: true,
          description: 'JPG, PNG o WebP. Recomendado: 1200 × 630 píxeles, con margen alrededor de textos y logotipos.',
        }
      - {
          name: imageAlt,
          label: Descripción de la imagen al compartir,
          type: string,
          required: true,
        }
      - name: pages
        label: Personalizar cada página
        type: object
        list: true
        description: Los campos vacíos usan los valores automáticos. Las obras y proyectos usan su portada si es JPG, PNG o WebP; las demás páginas usan la imagen general.
        fields:
          - name: path
            label: Ruta de la página
            type: string
            required: true
            description: 'Por ejemplo /, /tattoo/ o /obra/nombre-de-la-obra/. Copia solo la ruta, sin dominio, parámetros ni #. Cada ruta debe aparecer una sola vez.'
          - name: title
            label: Título al compartir
            type: string
            description: Opcional. Si queda vacío se usa el título de la página; en Inicio se usa el título general de esta sección.
          - name: description
            label: Descripción al compartir
            type: text
            description: Opcional. Si queda vacía se usa la descripción de la página; en Inicio se usa la descripción general de esta sección.
          - name: image
            label: Imagen al compartir
            type: image
            description: 'Opcional. JPG, PNG o WebP; recomendado 1200 × 630 píxeles. No uses SVG. Añade también su descripción alternativa.'
          - name: imageAlt
            label: Descripción alternativa de la imagen
            type: string
            description: Describe lo que se ve. Obligatoria si eliges una imagen propia; deja ambos campos vacíos para usar la imagen automática.
  - name: guests
    label: Próximos Guests
    type: file
    path: src/data/guests.json
    format: json
    fields:
      - {
          name: heading,
          label: Título de la agenda,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
          required: true,
        }
      - {
          name: eyebrow,
          label: Antetítulo,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
        }
      - {
          name: inquiryLabel,
          label: Texto para consultar cita,
          type: string,
          required: true,
        }
      - {
          name: mapsLabel,
          label: Texto del enlace a Google Maps,
          type: string,
          required: true,
        }
      - {
          name: alertsLabel,
          label: Enlace de avisos por ciudad,
          type: string,
          required: true,
        }
      - {
          name: emptyMessage,
          label: Mensaje sin fechas visibles,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
          required: true,
        }
      - {
          name: footerHeading,
          label: Título en el pie de página,
          type: rich-text,
          options: { format: markdown, media: false, switcher: false },
          required: true,
        }
      - {
          name: showInFooter,
          label: Mostrar resumen en el pie de página,
          type: boolean,
          default: true,
        }
      - name: entries
        label: Visitas
        type: object
        list: true
        fields:
          - name: id
            label: Identificador del enlace
            type: string
            required: true
            description: Único para cada visita. Usa minúsculas, números y guiones (por ejemplo barcelona-octubre). Consérvalo para no cambiar los enlaces.
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - { name: city, label: Ciudad, type: string, required: true }
          - { name: studio, label: Estudio, type: string }
          - { name: address, label: Dirección, type: text }
          - name: mapsUrl
            label: Enlace a Google Maps
            type: string
            description: Pega el enlace completo de Google Maps, incluido https://. Opcional e independiente de la dirección.
          - {
              name: description,
              label: Descripción,
              type: rich-text,
              options: { format: markdown, media: false, switcher: false },
            }
          - name: startDate
            label: Fecha de inicio
            type: date
            required: true
            options: { format: yyyy-MM-dd, time: false }
          - name: endDate
            label: Fecha de fin
            type: date
            required: true
            description: Para una sola jornada, repite la fecha de inicio. Incluye el año correspondiente a esta visita.
            options: { format: yyyy-MM-dd, time: false }
          - name: color
            label: Color
            type: string
            required: true
            default: '#deb9a0'
            description: 'Color hexadecimal de seis cifras. Ejemplos: #deb9a0, #b7c3a7, #e1c985, #b6bdce.'
            pattern: '^#[0-9a-fA-F]{6}$'
          - name: visible
            label: Visible
            type: boolean
            default: true
            description: Activa la visita en la agenda y en el pie. Desactívala cuando ya no quieras anunciarla.
  - name: ciudades
    label: Ciudades
    type: file
    path: src/data/ciudades.json
    format: json
    fields:
      - { name: cities, label: Ciudades, type: string, list: true }
      - { name: note, label: Nota, type: text }
  - name: flash-categories
    label: Categorías de flash
    type: collection
    path: src/data/flash-categories
    format: json
    filename: '{id}.json'
    view:
      primary: label
      fields: [label, id, order]
      sort: [order, label]
      default:
        sort: order
        order: asc
      search: [label, id]
    fields:
      - name: id
        label: Identificador
        type: string
        required: true
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: Identificador estable. Usa minúsculas, números y guiones y no lo cambies después de asignarlo a flashes.
      - { name: label, label: Nombre, type: string, required: true }
      - name: order
        label: Orden
        type: number
        required: true
        description: Posición del filtro, usando números consecutivos del 1 al total de categorías. El 1 aparece primero.
      - { name: featured, label: Destacada, type: boolean, default: false }
      - { name: image, label: Imagen personalizada, type: image }
      - { name: imageAlt, label: Texto alternativo de la imagen, type: string }
      - name: imageFrom
        label: Usar imagen de un flash
        type: reference
        options:
          collection: flash
          search: 'code,title'
          value: '{fields.code}'
          label: '{fields.code}'
    operations: { create: true, rename: true, delete: true }
  - name: obra-collections
    label: Colecciones de obra
    type: collection
    path: src/data/obra-collections
    format: json
    filename: '{id}.json'
    view:
      primary: title
      fields: [title, id]
      search: [title, id]
    fields:
      - name: id
        label: Identificador
        type: string
        required: true
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: Identificador estable. Usa minúsculas, números y guiones y no lo cambies después de asignarlo a obras.
      - name: title
        label: Título
        type: rich-text
        options: { format: markdown, media: false, switcher: false }
        required: true
      - name: description
        label: Descripción
        type: rich-text
        options: { format: markdown, media: false, switcher: false }
      - { name: featured, label: Destacada, type: boolean, default: false }
      - { name: image, label: Imagen personalizada, type: image }
      - { name: imageAlt, label: Texto alternativo de la imagen, type: string }
      - name: imageFrom
        label: Usar imagen de una obra
        type: reference
        options:
          collection: obras
          search: 'title'
          value: '{fields.title}'
          label: '{fields.title}'
    operations: { create: true, rename: true, delete: true }
